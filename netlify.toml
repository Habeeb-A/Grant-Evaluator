[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'Static site plus functions - no build step'"

[build.environment]
  NODE_VERSION = "20"

# ORDER MATTERS. Netlify applies the first matching rule, so the API routes have to
# come before the catch-all below. If the catch-all wins, POST /api/generate is served
# index.html and the browser gets HTML where it expected JSON — a variant of exactly
# what broke the previous deployment. Add new rules ABOVE the catch-all, and re-run
# the curl check in DEPLOYMENT.md afterwards.
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Single-page catch-all. Must stay last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
